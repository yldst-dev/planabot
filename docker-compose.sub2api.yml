services:
  planabot:
    environment:
      PLANABRAIN_AI_PROVIDER: sub2api
      PLANABRAIN_SUB2API_BASE_URL: http://sub2api:8080/v1
      PLANABRAIN_SUB2API_API_KEY: ${PLANABRAIN_SUB2API_API_KEY:-}
      PLANABRAIN_SUB2API_MODEL: ${PLANABRAIN_SUB2API_MODEL:-gpt-5.6-luna}
      PLANABRAIN_CHAT_THINKING_MODE: ${PLANABRAIN_CHAT_THINKING_MODE:-low}
      PLANABRAIN_CHAT_MAX_OUTPUT_TOKENS: ${PLANABRAIN_CHAT_MAX_OUTPUT_TOKENS:-8192}
    depends_on:
      sub2api:
        condition: service_healthy

  sub2api:
    image: weishaw/sub2api:0.2.7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${SUB2API_LOCAL_PORT:-8084}:8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?SUB2API_POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: sub2api-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SUB2API_REDIS_PASSWORD:?SUB2API_REDIS_PASSWORD is required}
      ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL:-admin@sub2api.local}
      ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD:?SUB2API_ADMIN_PASSWORD is required}
      JWT_SECRET: ${SUB2API_JWT_SECRET:?SUB2API_JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_ENCRYPTION_KEY:?SUB2API_TOTP_ENCRYPTION_KEY is required}
      TZ: Asia/Seoul
    volumes:
      - sub2api-data:/app/data
    networks:
      - default
      - sub2api-storage
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  sub2api-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?SUB2API_POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - sub2api-postgres-data:/var/lib/postgresql/data
    networks:
      - sub2api-storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api && psql -U sub2api -d sub2api -Atqc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  sub2api-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    environment:
      REDISCLI_AUTH: ${SUB2API_REDIS_PASSWORD:?SUB2API_REDIS_PASSWORD is required}
    volumes:
      - sub2api-redis-data:/data
    networks:
      - sub2api-storage
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sub2api-data:
  sub2api-postgres-data:
  sub2api-redis-data:

networks:
  sub2api-storage:
    internal: true
