services:
  planabot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_IMAGE: ${PLANABOT_RUST_IMAGE:-rust:1.86-slim-bookworm@sha256:57d415bbd61ce11e2d5f73de068103c7bd9f3188dc132c97cef4a8f62989e944}
        RUNTIME_IMAGE: ${PLANABOT_RUNTIME_IMAGE:-debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587}
        NODE_IMAGE: ${PLANABOT_NODE_IMAGE:-node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392}
    container_name: planabot
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 210s
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env:ro
      - ./.planabot:/app/.planabot
      - ./.planabrain:/app/.planabrain
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
