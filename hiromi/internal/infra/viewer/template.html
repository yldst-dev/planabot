<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>__HIROMI_TITLE__</title>
  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.145 0 0);
      --primary: oklch(0.205 0 0);
      --primary-foreground: oklch(0.985 0 0);
      --secondary: oklch(0.97 0 0);
      --secondary-foreground: oklch(0.205 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --accent: oklch(0.97 0 0);
      --accent-foreground: oklch(0.205 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.922 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
    }
    .dark {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--background);
      color: var(--foreground);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .shell {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    .top, .bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--card);
      border-color: var(--border);
    }
    .top { border-bottom: 1px solid var(--border); }
    .bottom { border-top: 1px solid var(--border); }
    .title {
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
      white-space: nowrap;
    }
    .stage {
      position: relative;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background: oklch(0.12 0 0);
      cursor: pointer;
      user-select: none;
    }
    .stage img {
      position: absolute;
      inset: 0;
      margin: auto;
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      min-width: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: calc(var(--radius) - 2px);
      background: var(--secondary);
      color: var(--secondary-foreground);
      font-weight: 500;
    }
    .btn:hover { background: var(--accent); }
    .btn:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .grow { flex: 1; }
    .track {
      position: relative;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
    }
    .fill {
      height: 100%;
      border-radius: 999px;
      background: var(--primary);
      width: 0%;
    }
    .hint {
      color: var(--muted-foreground);
      font-size: 12px;
    }
    @media (max-width: 640px) {
      .hint { display: none; }
      .title { max-width: 42vw; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="title" id="title">__HIROMI_TITLE__</div>
      <div class="meta" id="meta"></div>
    </header>
    <main class="stage" id="stage"></main>
    <footer class="bottom">
      <button class="btn" id="prev" type="button">이전</button>
      <div class="grow track" id="track"><div class="fill" id="fill"></div></div>
      <button class="btn btn-primary" id="next" type="button">다음</button>
      <span class="hint">← → 또는 화면 탭</span>
    </footer>
  </div>
  <script>
    const pages = __HIROMI_PAGES__;
    let i = 0;
    const img = document.createElement("img");
    img.alt = "";
    document.getElementById("stage").appendChild(img);
    function render() {
      if (!pages.length) return;
      img.src = pages[i];
      document.getElementById("meta").textContent = (i + 1) + " / " + pages.length;
      document.getElementById("fill").style.width = ((i + 1) / pages.length * 100) + "%";
      document.getElementById("prev").disabled = i === 0;
      document.getElementById("next").disabled = i === pages.length - 1;
    }
    function go(d) {
      const n = i + d;
      if (n < 0 || n >= pages.length) return;
      i = n;
      render();
    }
    document.getElementById("prev").onclick = function () { go(-1); };
    document.getElementById("next").onclick = function () { go(1); };
    document.getElementById("stage").onclick = function (e) {
      go(e.clientX > window.innerWidth / 2 ? 1 : -1);
    };
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft") go(-1);
    });
    render();
  </script>
</body>
</html>
