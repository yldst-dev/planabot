name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  # 변경 감지
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      planabrain: ${{ steps.filter.outputs.planabrain }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            rust:
              - 'core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            planabrain:
              - 'planabrain/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  # Rust 테스트 (core 변경 시만)
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test

  # TypeScript 테스트 (planabrain 변경 시만)
  test-planabrain:
    name: Test Planabrain
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.planabrain == 'true' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: planabrain
      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: planabrain
      - name: Build
        run: npm run build
        working-directory: planabrain

  # Docker 빌드 (코드/Docker 변경 시만, 테스트 통과 후)
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [changes, test-rust, test-planabrain]
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.outputs.rust == 'true' || 
       needs.changes.outputs.planabrain == 'true' || 
       needs.changes.outputs.docker == 'true') &&
      (needs.test-rust.result == 'success' || needs.test-rust.result == 'skipped') &&
      (needs.test-planabrain.result == 'success' || needs.test-planabrain.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Resolve Docker Platforms
        id: platforms
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=linux/amd64,linux/arm64" >> "${GITHUB_OUTPUT}"
          else
            echo "value=linux/amd64" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          platforms: ${{ steps.platforms.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=planabot-build
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,scope=planabot-build,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # GitHub Release 생성 (태그 푸시 시만)
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
