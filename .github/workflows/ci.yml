name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  # 변경 감지
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      planabrain: ${{ steps.filter.outputs.planabrain }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            planabrain:
              - 'planabrain/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  # Rust 테스트 (core 변경 시만)
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test

  # TypeScript 테스트 (planabrain 변경 시만)
  test-planabrain:
    name: Test Planabrain
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.planabrain == 'true' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: planabrain/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: planabrain
      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: planabrain
      - name: Build
        run: npm run build
        working-directory: planabrain

  # Docker 빌드 (코드/Docker 변경 시만, 테스트 통과 후)
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [changes, test-rust, test-planabrain]
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.changes.outputs.rust == 'true' || 
       needs.changes.outputs.planabrain == 'true' || 
       needs.changes.outputs.docker == 'true') &&
      (needs.test-rust.result == 'success' || needs.test-rust.result == 'skipped') &&
      (needs.test-planabrain.result == 'success' || needs.test-planabrain.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub Release 생성 (태그 푸시 시만)
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
